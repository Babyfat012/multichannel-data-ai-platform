# Feast thứ hai, riêng cho RAG: online store Postgres + pgvector (tìm theo vector), khác Feast SKU dùng Redis.
# Biến môi trường do DAG/pod truyền vào; Postgres chạy trong kind (ns rag).
project: platform_rag
provider: local
registry: ${FEAST_RAG_REGISTRY}
offline_store:
  type: file
online_store:
  type: postgres
  host: ${RAG_PG_HOST}
  port: ${RAG_PG_PORT}
  database: rag
  db_schema: public
  user: ${RAG_PG_USER}
  password: ${RAG_PG_PASSWORD}
  sslmode: disable          # pgvector local trong kind không bật TLS; lên Cloud SQL đổi thành require
  vector_enabled: true
entity_key_serialization_version: 3
