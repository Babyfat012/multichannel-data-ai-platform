# Đổi image.tag mỗi lần deploy để k8s rolling update; `helm upgrade --atomic` tự rollback nếu pod mới không Ready.
image:
  repository: fsds-feature-api
  tag: dev
  pullPolicy: Never   # kind: image nạp sẵn bằng `kind load`
replicas: 2
# Secret chứa AWS_*, FEAST_*; tạo ngoài chart từ .env (scripts/setup/deploy_kind_feature_api.sh).
envSecret: feature-api-env
nodePort: 30800
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 768Mi}   # + model embedding ONNX (~200 MB khi nạp)
