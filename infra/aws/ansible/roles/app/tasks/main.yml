# Đồng bộ mã và triển khai Compose; không chép credential hay dữ liệu local lên VM.
- name: Kiểm biến bắt buộc và secret đã điền
  ansible.builtin.assert:
    that:
      - aws_region is match('^[a-z]{2}-[a-z]+-[0-9]$')
      - raw_bucket != 'CHANGE_ME'
      - lakehouse_bucket != 'CHANGE_ME'
      - postgres_password != 'CHANGE_ME'
      - lakekeeper_encryption_key != 'CHANGE_ME'
      - postgres_password is match('^[A-Za-z0-9_-]{16,}$')
      - lakekeeper_encryption_key is match('^[A-Za-z0-9_-]{32,}$')
      - source_dataset_name is match('^[a-zA-Z0-9_-]+$')
      - warehouse_name is match('^[a-zA-Z0-9_-]+$')
      - (aws_runtime_profile | default('standard')) in ['standard', 'performance']
  no_log: true
- name: Kiểm tài nguyên trước khi bật profile performance
  ansible.builtin.assert:
    that:
      - ansible_facts['processor_vcpus'] | int >= 8
      - ansible_facts['memtotal_mb'] | int >= 30000
    fail_msg: Profile performance yêu cầu VM ít nhất 8 vCPU/32 GiB.
  when: (aws_runtime_profile | default('standard')) == 'performance'
- name: Kiểm Compose hỗ trợ override
  ansible.builtin.command: docker compose version --short
  register: compose_version
  changed_when: false
- name: Yêu cầu Compose tối thiểu 2.24.4
  ansible.builtin.assert:
    that: (compose_version.stdout | trim | regex_replace('^v', '')) is version('2.24.4', '>=')
- name: Tạo thư mục app
  ansible.builtin.file:
    path: '{{ app_dir }}'
    owner: '{{ ansible_user }}'
    state: directory
    mode: '0755'
- name: Đồng bộ repo bằng rsync, loại secret và thư mục phát sinh
  ansible.posix.synchronize:
    src: '{{ repo_local }}/'
    dest: '{{ app_dir }}/'
    use_ssh_args: true
    rsync_path: sudo rsync
    rsync_opts:
      - '--exclude=.venv/'
      - '--exclude=out/'
      - '--exclude=.git/'
      - '--exclude=.env'
      - '--exclude=.env.*'
      - '--exclude=.briefs/'
      - '--exclude=.vibe-wise/'
      - '--exclude=.aws/'
      - '--exclude=.codex/'
      - '--exclude=.claude/'
      - '--exclude=__pycache__/'
      - '--exclude=infra/aws/ansible/group_vars/'
      - '--exclude=infra/aws/terraform/'
      - '--exclude=infra/aws/kubernetes/'
      - '--exclude=.archive/'
  register: app_sync
  # --tags code: chỉ đồng bộ code (dags/, spark_jobs/, scripts/, trino/ được bind mount nên không cần
  # restart). Đổi compose/.env/Dockerfile thì vẫn chạy cả playbook.
  tags: [code]
- name: Tạo các thư mục persistent cho Spark
  ansible.builtin.file:
    path: '/mnt/platform-data/{{ item }}'
    state: directory
    mode: '0775'
    owner: '{{ airflow_uid }}'
    group: '0'
  loop: [airflow, spark-events, spark-worker-1, spark-worker-2, source]
- name: Tạo thư mục PostgreSQL riêng
  ansible.builtin.file:
    path: /mnt/platform-data/postgres
    state: directory
    mode: '0700'
- name: Sinh env từ biến đã điền
  ansible.builtin.template:
    src: env.j2
    dest: '{{ app_dir }}/.env'
    owner: '{{ ansible_user }}'
    mode: '0600'
  no_log: true
- name: Kiểm image đã được build
  ansible.builtin.command: docker image inspect platform-airflow:2.10.5-spark3.5.3
  register: airflow_image
  changed_when: false
  failed_when: false
# Code được mount vào container, image chỉ chứa Java + thư viện: build lại khi Dockerfile đổi, không phải khi code đổi.
- name: Đọc checksum Dockerfile airflow
  ansible.builtin.stat:
    path: '{{ app_dir }}/docker/Dockerfile.airflow'
  register: airflow_dockerfile
- name: So checksum với lần build trước
  ansible.builtin.copy:
    content: '{{ airflow_dockerfile.stat.checksum }}'
    dest: /mnt/platform-data/airflow/.dockerfile.sha1
    mode: '0644'
  check_mode: true
  register: airflow_dockerfile_stamp
- name: Build image driver và executor cùng Python 3.10
  ansible.builtin.command: docker compose --profile airflow build airflow
  args:
    chdir: '{{ app_dir }}'
  when: airflow_dockerfile_stamp.changed or airflow_image.rc != 0
  changed_when: true
# Ghi dấu SAU khi build thành công: build lỗi thì lần sau vẫn build lại.
- name: Ghi checksum Dockerfile đã build
  ansible.builtin.copy:
    content: '{{ airflow_dockerfile.stat.checksum }}'
    dest: /mnt/platform-data/airflow/.dockerfile.sha1
    mode: '0644'
- name: Tạo khóa Fernet một lần trước khi Airflow khởi động
  ansible.builtin.command:
    argv:
      - python3
      - infra/aws/ansible/roles/app/files/ensure_fernet.py
      - /mnt/platform-data/airflow/.fernet_key
      - '{{ airflow_uid | string }}'
    chdir: '{{ app_dir }}'
  register: fernet_setup
  changed_when: "'created' in fernet_setup.stdout"
  no_log: true
- name: Bật đúng dịch vụ Data Platform v2, chờ healthcheck
  ansible.builtin.command: >-
    docker compose --profile catalog --profile spark --profile airflow up -d --wait --wait-timeout 300
    postgres lakekeeper spark-master spark-worker-1 spark-worker-2 airflow node-exporter postgres-exporter
  args:
    chdir: '{{ app_dir }}'
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr or 'Recreated' in compose_up.stderr"
  no_log: true
- name: Build image MLflow (pip mlflow + psycopg2 + boto3)
  ansible.builtin.command: docker compose --profile ml build mlflow
  args:
    chdir: '{{ app_dir }}'
  changed_when: false
- name: Bật MLflow (chỉ mlflow + db-init, không bật registry local)
  ansible.builtin.command: docker compose --profile ml up -d --wait --wait-timeout 180 mlflow
  args:
    chdir: '{{ app_dir }}'
  register: mlflow_up
  changed_when: "'Started' in mlflow_up.stderr or 'Created' in mlflow_up.stderr or 'Recreated' in mlflow_up.stderr"
  no_log: true
- name: Chờ Airflow metadata và scheduler sẵn sàng
  ansible.builtin.uri:
    url: http://127.0.0.1:8081/health
    return_content: true
  register: airflow_health
  until: >-
    airflow_health.status == 200 and
    airflow_health.json.metadatabase.status == 'healthy' and
    airflow_health.json.scheduler.status == 'healthy'
  retries: 60
  delay: 5
- name: Bootstrap Lakekeeper S3 và kiểm cấu hình warehouse khi chạy lại
  ansible.builtin.command: bash scripts/setup/setup_lakekeeper_s3.sh
  args:
    chdir: '{{ app_dir }}'
  register: warehouse_setup
  changed_when: "'Đã tạo' in warehouse_setup.stdout"
- name: Nạp cấu hình Airflow và các Variable AWS
  ansible.builtin.shell: |
    set -a
    source .env
    set +a
    bash scripts/setup/setup_airflow.sh
  args:
    executable: /bin/bash
    chdir: '{{ app_dir }}'
  # Các lệnh upsert đưa DB về cùng cấu hình, không tạo bản ghi trùng.
  changed_when: false
  no_log: true
- name: Chuẩn bị venv cho sinh nguồn và nạp PostgreSQL
  ansible.builtin.pip:
    name:
      - 'psycopg[binary]==3.2.13'
      # Loader Walmart dùng load_settings từ setup_debezium, nơi import client Kafka.
      - 'confluent-kafka==2.15.1'
    virtualenv: /mnt/platform-data/venv
    virtualenv_command: python3 -m venv
