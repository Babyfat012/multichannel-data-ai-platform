# Cài Docker từ kho chính thức Ubuntu 24.04 và aws CLI cho tác vụ đồng bộ S3.
- name: Chỉ hỗ trợ Ubuntu 24.04
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version == '24.04'
- name: Cài công cụ hệ thống
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, rsync, python3-venv, python3-pip, e2fsprogs, util-linux]
    update_cache: true
    cache_valid_time: 3600
- name: Tạo nơi giữ khóa apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
- name: Lấy khóa Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
- name: Khai báo kho apt Docker
  ansible.builtin.apt_repository:
    repo: 'deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable'
    state: present
- name: Cài Docker Engine và Compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true
- name: Cài aws CLI v2 bằng snap (Ubuntu 24.04 không còn gói apt awscli)
  ansible.builtin.command: snap install aws-cli --classic
  args:
    creates: /snap/bin/aws
# Docker mặc định không giới hạn json-log: 28/10 datahub-gms ghi 35 GB khi Kafka DataHub chết, góp phần
# làm đầy EBS. Chỉ áp cho container tạo mới; app/datahub role sau đó compose up tạo lại.
- name: Giới hạn log mỗi container 100 MB × 3 file
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: '0644'
    content: |
      {"log-driver": "json-file", "log-opts": {"max-size": "100m", "max-file": "3"}}
  register: docker_daemon
- name: Khởi động lại Docker khi đổi cấu hình log
  ansible.builtin.service:
    name: docker
    state: restarted
  when: docker_daemon.changed
- name: Bật Docker trên VM đích
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
- name: Thêm người vận hành vào nhóm docker
  ansible.builtin.user:
    name: '{{ ansible_user }}'
    groups: docker
    append: true
