# Nhận diện đúng EBS theo volume ID (máy Nitro đổi tên /dev/sdf thành nvme); blkid bảo vệ filesystem hiện hữu trước mkfs.
- name: Xác nhận volume ID đã điền
  ansible.builtin.assert:
    that:
      - data_volume_id is match('^vol-[0-9a-f]+$')
- name: Tìm EBS theo volume ID
  ansible.builtin.stat:
    path: '{{ data_disk_path }}'
    follow: true
  register: data_disk
- name: Phải có block device
  ansible.builtin.assert:
    that: [data_disk.stat.exists, data_disk.stat.isblk]
- name: Kiểm chữ ký filesystem bằng blkid
  ansible.builtin.command:
    argv: [blkid, -p, '-o', value, '-s', TYPE, '{{ data_disk_path }}']
  register: disk_blkid
  changed_when: false
  failed_when: disk_blkid.rc not in [0, 2]
- name: Kiểm toàn bộ chữ ký và partition trước khi cho phép format
  ansible.builtin.command:
    argv: [lsblk, --json, --output, 'NAME,FSTYPE,MOUNTPOINT,PTTYPE', '{{ data_disk_path }}']
  register: disk_layout
  changed_when: false
- name: Từ chối format disk có partition hoặc mount dù blkid không thấy filesystem
  ansible.builtin.assert:
    that:
      - (disk_layout.stdout | from_json).blockdevices[0].children is not defined
      - not (disk_layout.stdout | from_json).blockdevices[0].pttype
      - not (disk_layout.stdout | from_json).blockdevices[0].mountpoint
  when: disk_blkid.rc == 2
- name: Chỉ mkfs khi blkid xác nhận chưa có filesystem
  ansible.builtin.command:
    argv: [mkfs.ext4, '{{ data_disk_path }}']
  when: disk_blkid.rc == 2
  changed_when: true
- name: Đọc UUID của filesystem
  ansible.builtin.command:
    argv: [blkid, '-o', value, '-s', UUID, '{{ data_disk_path }}']
  register: disk_uuid
  changed_when: false
- name: Đọc loại filesystem thực tế
  ansible.builtin.command:
    argv: [blkid, '-o', value, '-s', TYPE, '{{ data_disk_path }}']
  register: disk_fstype
  changed_when: false
- name: Tạo mountpoint
  ansible.builtin.file:
    path: /mnt/platform-data
    state: directory
    mode: '0755'
- name: Ghi mount UUID và mount nếu chưa có
  ansible.posix.mount:
    path: /mnt/platform-data
    src: 'UUID={{ disk_uuid.stdout | trim }}'
    fstype: '{{ disk_fstype.stdout | trim }}'
    opts: defaults
    state: mounted
- name: Nới filesystem khi EBS được tăng dung lượng (ext4 nới được lúc đang mount; đủ rồi thì không đổi gì)
  ansible.builtin.command:
    argv: [resize2fs, '{{ data_disk_path }}']
  register: disk_resize
  changed_when: "'Nothing to do' not in disk_resize.stderr"
# Docker 29 dùng containerd image store: image ở /var/lib/containerd, container/volume ở /var/lib/docker.
# Cả hai mặc định nằm ổ gốc 30 GB (đầy ngày 27 và 28/10). Bind mount hai thư mục sang EBS, giữ nguyên đường dẫn.
- name: Kiểm kho Docker/containerd đã nằm trên EBS chưa
  ansible.builtin.command:
    argv: [findmnt, --noheadings, --output, SOURCE, '/var/lib/{{ item }}']
  loop: [containerd, docker]
  register: engine_mounts
  changed_when: false
  failed_when: false
- name: Dời kho Docker/containerd sang EBS (một lần; dừng mọi container vài phút)
  when: engine_mounts.results | selectattr('rc', 'ne', 0) | list | length > 0
  block:
    - name: Dừng Docker và containerd để chép nhất quán
      ansible.builtin.systemd:
        name: '{{ item }}'
        state: stopped
      loop: [docker.socket, docker, containerd]
    - name: Chép sang EBS (giữ hardlink/xattr/owner; không --delete nên chạy lại an toàn)
      ansible.builtin.command:
        argv: [rsync, -aHAXx, --numeric-ids, '/var/lib/{{ item }}/', '/mnt/platform-data/{{ item }}/']
      loop: [containerd, docker]
      changed_when: true
    - name: Giữ bản cũ để đối chiếu; người vận hành tự xoá sau khi kiểm
      ansible.builtin.command:
        argv: [mv, '/var/lib/{{ item }}', '/var/lib/{{ item }}.pre-ebs']
        creates: '/var/lib/{{ item }}.pre-ebs'
      loop: [containerd, docker]
    - name: Tạo lại mountpoint rỗng
      ansible.builtin.file:
        path: '/var/lib/{{ item }}'
        state: directory
        mode: '0710'
      loop: [containerd, docker]
- name: Bind mount kho Docker/containerd từ EBS, chỉ sau khi EBS đã mount
  ansible.posix.mount:
    path: '/var/lib/{{ item }}'
    src: '/mnt/platform-data/{{ item }}'
    fstype: none
    opts: bind,x-systemd.requires-mounts-for=/mnt/platform-data
    state: mounted
  loop: [containerd, docker]
- name: Tạo thư mục drop-in systemd
  ansible.builtin.file:
    path: '/etc/systemd/system/{{ item }}.service.d'
    state: directory
    mode: '0755'
  loop: [containerd, docker]
- name: Chặn Docker/containerd khởi động khi EBS chưa gắn (nếu không sẽ tạo kho rỗng trên ổ gốc, im lặng)
  ansible.builtin.copy:
    dest: '/etc/systemd/system/{{ item }}.service.d/data-disk.conf'
    content: |
      [Unit]
      RequiresMountsFor=/var/lib/containerd /var/lib/docker
    mode: '0644'
  loop: [containerd, docker]
  register: engine_dropin
- name: Nạp lại systemd và bật lại Docker
  ansible.builtin.systemd:
    name: '{{ item }}'
    state: started
    daemon_reload: '{{ engine_dropin is changed }}'
  loop: [containerd, docker]
