# Người vận hành chạy playbook này trên EC2; mặc định không sinh nguồn hoặc smoke Cloud.
- name: Chuẩn bị runtime Data Platform v2 trên một VM
  hosts: aws
  become: true
  roles:
    - role: base
    - role: data_disk
    - role: app
    - role: datahub
      when: enable_datahub | default(true) | bool
    - role: source_data
      tags: [never, source_data]
    - role: smoke
      tags: [never, smoke]
