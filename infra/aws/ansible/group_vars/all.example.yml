# Sao chép thành all.yml, điền output Terraform và mã hóa secret bằng ansible-vault.
aws_region: ap-southeast-1
# standard: VM 4 vCPU/16 GiB; performance: VM ít nhất 8 vCPU/32 GiB.
aws_runtime_profile: standard
raw_bucket: CHANGE_ME
lakehouse_bucket: CHANGE_ME
# Output `data_volume_id` của Terraform (vol-...); disk nằm ở
# /dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_<id bỏ dấu ->.
data_volume_id: CHANGE_ME
app_dir: /opt/platform
# Đường dẫn tuyệt đối của repo trên máy điều khiển Ansible.
repo_local: /ABSOLUTE/PATH/PLATFORM
postgres_user: platform
postgres_db: sources
postgres_password: CHANGE_ME
lakekeeper_encryption_key: CHANGE_ME
airflow_uid: 50000
warehouse_name: platform-aws
# Nguồn scale 150 ngày tới cuối tháng 5: đủ cửa sổ 30 ngày trước cutoff cho warehouse và đủ dòng để đo skew.
source_mode: scale
# Mỗi cấu hình nguồn mới phải dùng tên mới; không ghi đè dữ liệu đã sinh.
source_dataset_name: aws-scale150-seed7
source_seed: 7
source_days: 150
source_orders_per_day: 20
source_followup_days: 270
source_observation_days: 285
source_cutoff: '2026-06-01T00:00:00.000000Z'
# Spark --packages chỉ nhận group:artifact:version. hadoop-aws kéo theo aws-java-sdk-bundle
# để Spark đọc file raw qua s3a://; Iceberg đọc ghi bảng bằng S3FileIO trong iceberg-aws-bundle.
spark_packages_aws: 'org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.11.0,org.apache.iceberg:iceberg-aws-bundle:1.11.0,org.postgresql:postgresql:42.7.4,org.apache.hadoop:hadoop-aws:3.3.4'

# Chỉ chuẩn bị SDK/quickstart; live runner khởi động sau khi dừng Spark/Airflow.
enable_datahub: true
