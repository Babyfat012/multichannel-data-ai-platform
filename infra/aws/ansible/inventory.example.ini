# Điền output Terraform: ansible_host là instance ID, SSH đi qua SSM nên không cần IP hay cổng 22. accept-new: lần đầu tự nhận host key (Ansible không hỏi yes/no được), key đổi về sau vẫn bị chặn.
[aws]
platform ansible_host=INSTANCE_ID ansible_user=ubuntu

[aws:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/platform_aws
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new -o ProxyCommand="aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p --region REGION"
