# Điền output Terraform và tài khoản OS Login; gcloud chỉ chạy khi người học gọi Ansible.
[gcp]
fsds ansible_host=VM_NAME ansible_user=OS_LOGIN_USER

[gcp:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/google_compute_engine
ansible_ssh_common_args=-o ProxyCommand="gcloud compute start-iap-tunnel %h 22 --listen-on-stdin --project=PROJECT_ID --zone=ZONE --verbosity=error"
