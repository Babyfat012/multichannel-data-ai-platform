# Cài Docker từ kho chính thức Debian 12 và CLI GCP cho tác vụ người học chạy.
- name: Chỉ hỗ trợ Debian 12
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Debian'
      - ansible_distribution_major_version == '12'
- name: Cài công cụ hệ thống
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, rsync, python3-venv, python3-pip, e2fsprogs, util-linux]
    update_cache: true
    cache_valid_time: 3600
- name: Tạo nơi giữ khóa apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
- name: Lấy khóa Docker và Google CLI
  ansible.builtin.get_url:
    url: '{{ item.url }}'
    dest: '{{ item.dest }}'
    mode: '0644'
  loop:
    - {url: 'https://download.docker.com/linux/debian/gpg', dest: /etc/apt/keyrings/docker.asc}
    - {url: 'https://packages.cloud.google.com/apt/doc/apt-key.gpg', dest: /etc/apt/keyrings/google-key.pub}
- name: Chuyển khóa Google sang keyring nhị phân apt
  ansible.builtin.command:
    argv: [gpg, --dearmor, --yes, --output, /etc/apt/keyrings/google.gpg, /etc/apt/keyrings/google-key.pub]
    creates: /etc/apt/keyrings/google.gpg
- name: Khai báo kho apt chính thức
  ansible.builtin.apt_repository:
    repo: '{{ item }}'
    state: present
  loop:
    - 'deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable'
    - 'deb [signed-by=/etc/apt/keyrings/google.gpg] https://packages.cloud.google.com/apt cloud-sdk main'
- name: Cài Docker Engine, Compose plugin và gcloud
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin, google-cloud-cli]
    state: present
    update_cache: true
- name: Bật Docker trên VM đích
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
- name: Thêm người học vào nhóm docker
  ansible.builtin.user:
    name: '{{ ansible_user }}'
    groups: docker
    append: true
