# Postgres + pgvector: online store của Feast RAG (platform_rag). Airflow trong Compose ghi qua
# platform-control-plane:30432; Feature API trong cụm đọc qua pgvector.rag.svc. Mật khẩu: Secret rag-pg (từ .env).
apiVersion: v1
kind: Namespace
metadata:
  name: rag
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: rag
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
# Image pgvector chỉ cài sẵn extension, không bật trong DB. Feast tạo cột `vector` ⇒ cần CREATE EXTENSION.
# initdb chỉ chạy khi PVC mới (30/10: xoá PVC pgdata ⇒ DB mới thiếu extension ⇒ `type "vector" does not exist`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgvector-init
  namespace: rag
data:
  vector.sql: CREATE EXTENSION IF NOT EXISTS vector;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector
  namespace: rag
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: pgvector}
  template:
    metadata:
      labels: {app: pgvector}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.1-pg17
          env:
            - {name: POSTGRES_DB, value: rag}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          envFrom: [{secretRef: {name: rag-pg}}]   # POSTGRES_USER, POSTGRES_PASSWORD
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d rag"]}
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: pgdata}
        - name: init
          configMap: {name: pgvector-init}
---
apiVersion: v1
kind: Service
metadata:
  name: pgvector
  namespace: rag
spec:
  type: NodePort
  selector: {app: pgvector}
  ports:
    - {port: 5432, targetPort: 5432, nodePort: 30432}
