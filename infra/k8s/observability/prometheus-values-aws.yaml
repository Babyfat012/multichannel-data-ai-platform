# Chỉ cho EKS (deploy_kind_observability.sh nạp khi KCTX không phải kind-*): Prometheus pull exporter trên
# EC2 qua IP riêng (SG mở 9100/9187 từ SG cluster). Không Alertmanager: luật hiện ở trang Alerts của
# Prometheus/Grafana. ponytail: không ai được báo nếu không mở trang; prod thêm Alertmanager + mail.
extraScrapeConfigs: |
  - job_name: ec2-node
    static_configs: [{targets: ["10.42.0.12:9100"]}]
  - job_name: ec2-postgres
    static_configs: [{targets: ["10.42.0.12:9187"]}]
serverFiles:
  alerting_rules.yml:
    groups:
      - name: ec2-data-platform
        rules:
          # Pull: EC2/exporter chết thì lần scrape fail tự ra up=0 — không cần luật "im lặng".
          - alert: EC2ExporterDown
            expr: up{job=~"ec2-.*"} == 0
            for: 2m
          # Gap #20: 28/10 shuffle Spark làm đầy EBS ⇒ Postgres chết, không ai biết.
          - alert: EC2DataDiskAlmostFull
            expr: 1 - node_filesystem_avail_bytes{mountpoint="/mnt/platform-data"} / node_filesystem_size_bytes{mountpoint="/mnt/platform-data"} > 0.8
            for: 5m
          # Gap #17: slot replication (Debezium) không đọc ⇒ Postgres giữ WAL mãi ⇒ đầy ổ.
          - alert: PostgresSlotWalRetained
            expr: pg_replication_slot_slot_current_wal_lsn - pg_replication_slot_slot_confirmed_flush_lsn > 1073741824
            for: 10m
