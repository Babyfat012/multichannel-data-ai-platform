# Cụm k8s local cho phần MLE (1 node, image node mặc định của kind đang cài). Tên node: fsds-ml-control-plane.
# Airflow/Spark trong Compose gọi vào qua NodePort sau khi nối node vào mạng fsds_default.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fsds-ml
# Registry local (scripts/setup/setup_kind_registry.sh): containerd đọc hosts.toml trong certs.d.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
