# Kho online của Feast. Không bật persistence: mất pod thì materialize lại từ Parquet.
apiVersion: v1
kind: Namespace
metadata:
  name: feature-store
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: feature-store
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "256mb"]
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 320Mi}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
---
# NodePort 30379: Airflow trong Compose gọi platform-control-plane:30379.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: feature-store
spec:
  type: NodePort
  selector: {app: redis}
  ports:
    - port: 6379
      targetPort: 6379
      nodePort: 30379
