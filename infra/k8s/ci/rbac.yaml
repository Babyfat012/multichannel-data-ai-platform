# RBAC cho Jenkins trên EC2 (nhóm `platform-ci` từ EKS access entry, infra/aws/kubernetes/cluster.tf).
# Toàn quyền CHỈ trong các namespace CI deploy (kagent: Agent/ModelConfig là CRD; feature-store: helm Feature API;
# agentgateway: pod smoke; langfuse: port-forward đọc prompt). Ngoài đó chỉ được đọc Namespace (kubectl apply
# của script deploy đọc namespace trước). Admin apply 1 lần: kubectl --context platform-apps apply -f infra/k8s/ci/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-ci-read-namespaces
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-ci-read-namespaces
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: platform-ci-read-namespaces}
subjects: [{apiGroup: rbac.authorization.k8s.io, kind: Group, name: platform-ci}]
---
apiVersion: v1
kind: Namespace
metadata:
  name: kagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-ci-deployer
  namespace: kagent
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-ci-deployer
  namespace: kagent
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-ci-deployer}
subjects: [{apiGroup: rbac.authorization.k8s.io, kind: Group, name: platform-ci}]
---
