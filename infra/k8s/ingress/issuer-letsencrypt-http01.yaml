# Let's Encrypt production, giải HTTP-01 qua chính ingress nginx (cần domain trỏ về NLB, cổng 80 mở).
# Render bởi setup_ingress.sh khi INGRESS_ISSUER=platform-letsencrypt; email điền lúc chạy.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "@@LE_EMAIL@@"
    privateKeySecretRef:
      name: platform-letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
