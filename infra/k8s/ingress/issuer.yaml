# CA nội bộ cho HTTPS local: self-signed → cert CA (10 năm) → ClusterIssuer `fsds-local-ca`.
# Trên GKE với domain thật thay bằng ClusterIssuer ACME (Let's Encrypt).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: selfsigned}
spec: {selfSigned: {}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: fsds-local-ca, namespace: cert-manager}
spec:
  isCA: true
  commonName: FSDS Local CA
  secretName: fsds-local-ca
  duration: 87600h
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: selfsigned, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: fsds-local-ca}
spec: {ca: {secretName: fsds-local-ca}}
