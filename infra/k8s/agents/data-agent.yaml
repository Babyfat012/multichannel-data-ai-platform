# Agent 1 (Data Agent): kéo dữ liệu từ Online Feature Store theo ID qua MCP tool: feature theo SKU
# (`get_sku_features`) và chunk chính sách theo chunk_id (`get_policy_chunks`).
# Tool đi qua agentgateway (/mcp, cần API key), không gọi thẳng Feature API; model dùng default-model-config.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: feature-tools
  namespace: kagent
spec:
  description: Feature tỷ lệ trả hàng theo SKU (Feast online store), qua agentgateway
  protocol: STREAMABLE_HTTP
  url: http://agentgateway.agentgateway.svc.cluster.local:3000/mcp
  headersFrom:
    - name: Authorization
      valueFrom: {type: Secret, name: kagent-agw-key, key: AUTH_HEADER}
  timeout: 30s
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: data-agent
  namespace: kagent
spec:
  type: Declarative
  # Mô tả = mô tả tool mà Coordinator thấy ⇒ tiếng Anh, có từ khoá.
  description: Looks up the return history numbers of a SKU (return rate 90 days, returns 24 hours) and chunk text by chunk id.
  declarative:
    modelConfig: default-model-config
    stream: false
    # System prompt quản lý trên Langfuse (prompt fsds-data-agent, label production); scripts/setup/sync_agent_prompts.py
    # đẩy bản production vào ConfigMap agent-prompts. Bản gốc lần đầu: infra/k8s/agents/prompts/data-agent.txt.
    systemMessageFrom: {type: ConfigMap, name: agent-prompts, key: data-agent}
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: feature-tools
          toolNames: [get_sku_features, get_policy_chunks]
    deployment:
      # Không khai `replicas`: số replica do KEDA quyết định (data-agent-keda.yaml).
      resources:
        requests: {cpu: 50m, memory: 192Mi}
        limits: {memory: 512Mi}
