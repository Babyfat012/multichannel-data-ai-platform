# Danh bạ agentregistry: Model Agent — chạy trên kagent (infra/k8s/agents/model-agent.yaml), model qua agentgateway.
apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: model-agent
spec:
  title: Model Agent
  description: "Chấm rủi ro Return cho đơn mới (KServe return-risk) và trả lời câu hỏi chính sách trả hàng bằng RAG (Feast pgvector). Model: ModelConfig default-model-config (qua agentgateway)."
  source:
    image: ghcr.io/kagent-dev/kagent/golang-adk:0.10.3
    protocol: A2A
    repository:
      url: https://github.com/Babyfat012/Project-MLOps
      subfolder: infra/k8s/agents
  mcpServers:
    - kind: MCPServer
      name: feature-tools
