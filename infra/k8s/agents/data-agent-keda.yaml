# Autoscale Data Agent bằng KEDA theo tải A2A thật: tốc độ request vào route a2a-data-agent của agentgateway
# (Prometheus). Tối thiểu 2 replica (multi-replica), tối đa 3; mỗi replica gánh ~0,5 request/giây.
# Agent không khai `replicas` nên kagent không giành quyền với HPA do KEDA tạo.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: data-agent
  namespace: kagent
spec:
  scaleTargetRef:
    name: data-agent
  minReplicaCount: 2
  maxReplicaCount: 3   # local 14 GB; GKE nâng lên
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.observability.svc.cluster.local
        query: sum(rate(agentgateway_requests_total{route="default/a2a-data-agent"}[1m]))
        threshold: "0.5"
