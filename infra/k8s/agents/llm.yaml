# LLM nhỏ chạy CPU, API kiểu OpenAI (/v1/chat/completions) cho Agent. Bản local thay cho llm-d
# (llm-d cần GPU ⇒ để dành GCP). Model tải 1 lần vào PVC; scale về 0 khi không dùng để trả RAM.
apiVersion: v1
kind: Namespace
metadata:
  name: llm
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: llm
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 3Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen
  namespace: llm
spec:
  replicas: 1
  strategy: {type: Recreate}   # PVC RWO: pod cũ phải nhả volume trước
  selector:
    matchLabels: {app: qwen}
  template:
    metadata:
      labels: {app: qwen}
      annotations:              # Prometheus lấy /metrics: token/giây, số request đang xử lý
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server@sha256:9fbaa06d7f4449e2ae0d02b40e0431f7c212dcf231c9e3a7777a6afc2cc8f312  # build b11749
          # Cấu hình B sau benchmark (docs/llm-platform-agents.md): luồng = số nhân thật, 4 slot, flash-attention,
          # KV cache q8_0 (đỡ RAM ⇒ đủ chỗ cho ctx 16384 = 4 slot × 4096 token).
          args:
            - "-hf"
            - "Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"
            - "--alias"
            - "qwen2.5-1.5b-instruct"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--ctx-size"
            - "16384"
            - "--threads"
            - "6"
            - "--parallel"
            - "4"
            - "--flash-attn"
            - "on"
            - "--cache-type-k"
            - "q8_0"
            - "--cache-type-v"
            - "q8_0"
            - "--jinja"   # chat template có tool calling
            - "--metrics" # /metrics Prometheus (token, độ trễ)
          env:
            - {name: LLAMA_CACHE, value: /models}
          ports: [{name: http, containerPort: 8080}]
          volumeMounts: [{name: models, mountPath: /models}]
          resources:
            requests: {cpu: "1", memory: 1200Mi}
            limits: {memory: 1600Mi}
          startupProbe:          # lần đầu phải tải ~1 GB
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: models}
---
apiVersion: v1
kind: Service
metadata:
  name: qwen
  namespace: llm
spec:
  selector: {app: qwen}
  ports: [{name: http, port: 8080, targetPort: http}]
