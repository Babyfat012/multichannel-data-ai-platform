# A/B (rubric mle 52–53): nhánh B = LLM nhỏ hơn (Qwen2.5-0.5B Q4) cùng image llama.cpp với nhánh A
# (qwen, 1.5B). agentgateway chia traffic theo trọng số giữa hai bản (virtual model `fsds-chat`).
# PVC riêng: PVC `models` là RWO và đang gắn vào pod qwen. Scale về 0 khi xong để trả RAM.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-small
  namespace: llm
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-small
  namespace: llm
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: qwen-small}
  template:
    metadata:
      labels: {app: qwen-small}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server@sha256:9fbaa06d7f4449e2ae0d02b40e0431f7c212dcf231c9e3a7777a6afc2cc8f312  # build b11749
          # Cùng cấu hình đã benchmark của nhánh A để so công bằng; chỉ khác model.
          args: ["-hf", "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M", "--alias", "qwen2.5-0.5b-instruct",
                 "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "8192", "--threads", "4",
                 "--parallel", "2", "--flash-attn", "on", "--cache-type-k", "q8_0", "--cache-type-v", "q8_0",
                 "--jinja", "--metrics"]
          env:
            - {name: LLAMA_CACHE, value: /models}
          ports: [{name: http, containerPort: 8080}]
          volumeMounts: [{name: models, mountPath: /models}]
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {memory: 900Mi}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: models-small}
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-small
  namespace: llm
spec:
  selector: {app: qwen-small}
  ports: [{name: http, port: 8080, targetPort: http}]
