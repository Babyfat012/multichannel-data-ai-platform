# Cấu hình Jenkins bằng code (JCasC). Secret KHÔNG nằm ở đây: lấy từ biến môi trường do
# scripts/setup/setup_jenkins.sh đọc từ Vault lúc khởi động.
jenkins:
  systemMessage: "FSDS CI/CD (local). Secret ứng dụng nằm ở Vault; Jenkins chỉ giữ token chỉ-đọc."
  numExecutors: 1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: vault-ci-token
              description: Token Vault chỉ-đọc (policy fsds-read)
              secret: "${VAULT_CI_TOKEN}"
          - file:
              scope: GLOBAL
              id: kind-kubeconfig
              fileName: kubeconfig
              secretBytes: "${base64:${readFile:/run/secrets/kubeconfig}}"
unclassified:
  location:
    url: "http://localhost:8090/"
jobs:
  # Mỗi ci/jenkins/<tên>.Jenkinsfile thành một pipeline job, lấy code từ repo git (nhánh main) ⇒ CI
  # chạy đúng code đã commit, không phải working tree.
  - script: |
      ['stream-features', 'feature-api-agents', 'coordinator', 'rag-pipeline'].each { name ->
        pipelineJob(name) {
          definition {
            cpsScm {
              scm { git { remote { url('file:///repo') }; branch('*/main') } }
              scriptPath("ci/jenkins/${name}.Jenkinsfile")
            }
          }
        }
      }
