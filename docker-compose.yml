# Môi trường nguồn giả lập cho generator: MinIO (export dạng file) và PostgreSQL
# (hệ thống của phòng ban khác). Chạy: cp .env.example .env && docker compose up -d
# Thứ tự: minio, postgres -> minio-init (tạo bucket) -> generator-batch -> generator-load.
# Stream (Kafka) nằm trong profile riêng: docker compose --profile stream up -d
# Spark standalone (1 master + 2 worker) cũng ở profile riêng: docker compose --profile spark up -d
# Lakekeeper (REST catalog cho Iceberg) nằm trong profile catalog và được profile spark kéo theo.

name: platform

x-generator: &generator
  build: .
  image: platform-generator:optimize
  env_file: .env
  environment:
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    FSSPEC_S3_ENDPOINT_URL: http://minio:9000

# Spark: mọi service dùng chung một image. Thư mục spark_jobs/ được mount (chỉ đọc) vào
# CẢ BA container ở CÙNG đường dẫn /opt/spark_jobs: sửa file trên host là thấy ngay, không build lại. Chạy bằng root để ghi được vào volume spill
# (volume mới tạo thuộc root); đây là môi trường dev trên máy cá nhân.
x-spark: &spark
  # Phải là biến thể java17: Iceberg 1.11.0 được build cho Java 17 (class file 61),
  # image mặc định apache/spark:3.5.3 chạy Java 11 (đọc tối đa class 55) -> job chết
  # ngay khi nạp iceberg-spark-runtime với UnsupportedClassVersionError.
  image: apache/spark:3.5.3-java17
  profiles: [spark]
  user: root
  env_file: .env
  environment:
    PYTHONPATH: /opt
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    env_file: .env
    ports: ["${MINIO_API_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      minio: {condition: service_healthy}
    env_file: .env
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
      && mc mb --ignore-existing local/$$MINIO_BUCKET"

  postgres:
    image: postgres:15
    # Debezium đọc thay đổi đã commit từ WAL; giữ tối đa bốn slot cho môi trường dev.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    env_file: .env
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

  generator-batch:
    <<: *generator
    depends_on:
      minio-init: {condition: service_completed_successfully}
    command: ["batch", "--config", "${GENERATOR_CONFIG}", "--output", "s3://${MINIO_BUCKET}"]

  generator-load:
    <<: *generator
    depends_on:
      generator-batch: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    command: ["load-postgres", "--source", "s3://${MINIO_BUCKET}",
              "--dsn", "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"]

  # Kafka một node, chế độ KRaft (không cần ZooKeeper).
  # Trong mạng Compose dùng kafka:9092, từ máy host dùng localhost:${KAFKA_PORT}.
  kafka:
    image: apache/kafka:3.9.1
    profiles: [stream, cdc]
    ports: ["${KAFKA_PORT:-9094}:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Gap #12: mặc định image ghi /tmp/kraft-combined-logs (lớp ghi container) ⇒ tạo lại container là mất topic.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 20

  # Phát Stream sau cutoff vào Kafka, ghi stream_manifest.json vào MinIO.
  generator-stream:
    <<: *generator
    profiles: [stream]
    depends_on:
      kafka: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    command: ["stream", "--config", "${GENERATOR_CONFIG}", "--sink", "kafka", "--bootstrap", "kafka:9092",
              "--speed", "${STREAM_SPEED:-1}", "--output", "s3://${MINIO_BUCKET}"]

  # Lakekeeper: cuốn sổ "bảng Iceberg nào đang trỏ tới file metadata nào" cho Spark và Flink.
  # Sổ nằm trong DB `lakekeeper` của container postgres có sẵn, tách khỏi DB `sources`
  # (giả làm hệ thống phòng ban khác) để không trộn lẫn. File metadata thật nằm trên MinIO.
  # Postgres chỉ tự tạo DB lần đầu, nên DB này phải tạo bằng một bước riêng (chạy lại được).
  lakekeeper-db-init:
    image: postgres:15
    profiles: [catalog, spark, query]
    depends_on:
      postgres: {condition: service_healthy}
    env_file: .env
    entrypoint: >
      sh -c "export PGPASSWORD=$$POSTGRES_PASSWORD
      && psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc
      \"SELECT 1 FROM pg_database WHERE datname='lakekeeper'\" | grep -q 1
      || psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'CREATE DATABASE lakekeeper'"

  lakekeeper-migrate: &lakekeeper
    image: quay.io/lakekeeper/catalog:v0.13.6
    profiles: [catalog, spark, query]
    depends_on:
      lakekeeper-db-init: {condition: service_completed_successfully}
    environment: &lakekeeper-env
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
    command: ["migrate"]

  lakekeeper:
    <<: *lakekeeper
    depends_on:
      lakekeeper-migrate: {condition: service_completed_successfully}
    environment:
      <<: *lakekeeper-env
      LAKEKEEPER__BASE_URI: http://lakekeeper:8181
    command: ["serve"]
    ports: ["${LAKEKEEPER_PORT:-8181}:8181"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      retries: 20

  # Spark master chỉ điều phối nên rất nhẹ. Spark UI: http://localhost:8080
  spark-master:
    <<: *spark
    depends_on:
      lakekeeper: {condition: service_healthy}
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master"]
    ports: ["${SPARK_MASTER_PORT:-7077}:7077", "${SPARK_UI_PORT:-8080}:8080"]
    # /data/raw mount read-only: dữ liệu 93 GiB nằm ngoài volume Docker, không vừa MinIO
    # trên / (chỉ còn ~42 GB). Spark đọc trực tiếp từ đĩa; bảng Iceberg vẫn ghi lên MinIO.
    # ./out/spark-events: Spark UI chỉ sống khi job đang chạy. Ghi event log ra host
    # để mở lại bằng History Server và chụp ảnh bằng chứng sau khi job đã xong.
    volumes: [./spark_jobs:/opt/spark_jobs:ro, /data/raw:/data/raw:ro,
              /data/raw/ground-truth:/data/ground-truth:ro,
              ./out/ground-truth-bridge:/data/ground-truth-bridge:ro,
              ./out/channels-small/source-exports:/data/channels-small/source-exports:ro,
              ./out/spark-events:/spark-events,
              "${PLATFORM_ORDER_LIFECYCLE_DIR:-./out/order_lifecycle_live}:/data/order_lifecycle:ro"]
    mem_limit: 512m

  # Worker làm việc thật. RAM worker là con số mình ĐẶT (SPARK_WORKER_MEMORY), thiếu thì
  # Spark spill ra đĩa. mem_limit cao hơn một chút để chừa chỗ cho JVM overhead.
  # SPARK_LOCAL_DIRS trỏ vào volume (nằm trên /), KHÔNG dùng /tmp vì /tmp là RAM.
  spark-worker-1: &spark-worker
    <<: *spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077"]
    depends_on: [spark-master]
    environment:
      PYTHONPATH: /opt
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_LOCAL_DIRS: /spark-local
    volumes: [spark-local-1:/spark-local, "./spark_jobs:/opt/spark_jobs:ro",
              "/data/raw:/data/raw:ro", "/data/raw/ground-truth:/data/ground-truth:ro",
              "./out/ground-truth-bridge:/data/ground-truth-bridge:ro",
              "./out/channels-small/source-exports:/data/channels-small/source-exports:ro",
              "./out/spark-events:/spark-events",
              "${PLATFORM_ORDER_LIFECYCLE_DIR:-./out/order_lifecycle_live}:/data/order_lifecycle:ro"]
    mem_limit: ${SPARK_WORKER_MEM_LIMIT:-2560m}

  spark-worker-2:
    <<: *spark-worker
    volumes: [spark-local-2:/spark-local, "./spark_jobs:/opt/spark_jobs:ro",
              "/data/raw:/data/raw:ro", "/data/raw/ground-truth:/data/ground-truth:ro",
              "./out/ground-truth-bridge:/data/ground-truth-bridge:ro",
              "./out/channels-small/source-exports:/data/channels-small/source-exports:ro",
              "./out/spark-events:/spark-events",
              "${PLATFORM_ORDER_LIFECYCLE_DIR:-./out/order_lifecycle_live}:/data/order_lifecycle:ro"]

  # Airflow dùng DB riêng trong PostgreSQL hiện có. Chỉ tạo DB, không đổi `sources`.
  airflow-db-init:
    image: postgres:15
    profiles: [airflow]
    depends_on:
      postgres: {condition: service_healthy}
    env_file: .env
    entrypoint: >
      sh -c "export PGPASSWORD=$$POSTGRES_PASSWORD
      && psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc
      \"SELECT 1 FROM pg_database WHERE datname='airflow'\" | grep -q 1
      || psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'CREATE DATABASE airflow'"

  # Một container dev chạy webserver + scheduler. SparkSubmitOperator sinh driver ở đây;
  # không đặt driver trên spark-master (container đó chỉ có 512 MB).
  airflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    image: platform-airflow:2.10.5-spark3.5.3
    profiles: [airflow]
    user: "${AIRFLOW_UID:-1000}:0"
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PARALLELISM: "1"
      AIRFLOW__CORE__FERNET_KEY_CMD: "cat /opt/airflow/.fernet_key"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      PYTHONPATH: /opt
      SPARK_LOCAL_HOSTNAME: airflow
      PLATFORM_CONTRACTS_DIR: /opt/contracts
    depends_on:
      airflow-db-init: {condition: service_completed_successfully}
    # `airflow standalone` để lại PID file trong volume sau khi container dừng.
    # Nếu giữ PID cũ, lần khởi động sau webserver tự thoát dù scheduler vẫn chạy.
    command: ["bash", "-c", "rm -f /opt/airflow/airflow-webserver.pid && exec airflow standalone"]
    ports: ["${AIRFLOW_WEB_PORT:-8081}:8080"]
    volumes: [airflow-data:/opt/airflow, ./out/receipts:/opt/airflow/receipts,
              ./dags:/opt/airflow/dags:ro,
              ./scripts:/opt/platform/scripts:ro,
              ./sql:/opt/sql:ro, ./spark_jobs:/opt/spark_jobs:ro, ./contracts:/opt/contracts:ro, /data/raw:/data/raw:ro,
              ./feature_repo:/opt/feature_repo:ro, ./rag:/opt/rag/rag:ro,
              /data/raw/ground-truth:/data/ground-truth:ro,
              ./out/ground-truth-bridge:/data/ground-truth-bridge:ro,
              ./out/channels-small/source-exports:/data/channels-small/source-exports:ro,
              ./out/spark-events:/spark-events,
              "${PLATFORM_ORDER_LIFECYCLE_DIR:-./out/order_lifecycle_live}:/data/order_lifecycle:ro"]
    # 6g: driver Spark client mode của DAG v2 chạy trong container này với heap 3g.
    mem_limit: 6g

  # Flink SQL đọc Kafka đã phát để chứng minh watermark, state và Window.
  # Bật riêng profile này sau khi DP1/DP2 kết thúc để giữ RAM cho TaskManager.
  flink-jobmanager:
    build:
      context: .
      dockerfile: docker/Dockerfile.flink
    image: platform-flink:1.20.3-kafka3.4.0
    profiles: [flink]
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 768m
        rest.address: flink-jobmanager
    ports: ["${FLINK_UI_PORT:-8082}:8081"]
    volumes: [./flink_jobs:/opt/flink/jobs:ro, ./out/flink:/opt/flink/output]
    mem_limit: 1024m

  flink-taskmanager:
    image: platform-flink:1.20.3-kafka3.4.0
    profiles: [flink]
    command: taskmanager
    depends_on: [flink-jobmanager]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 2
    volumes: [./flink_jobs:/opt/flink/jobs:ro, ./out/flink:/opt/flink/output]
    mem_limit: 1280m

  # ML Platform: đọc stream feature Flink ghi ở Kafka, push vào Feast (Redis trong kind + Parquet MinIO).
  # Cần chạy scripts/setup/setup_kind_feature_store.sh trước để có Redis.
  feast-pusher:
    build: {context: ., dockerfile: docker/Dockerfile.feast}
    image: platform-feast:0.66.0
    profiles: [ml-stream]
    command: ["python", "push_stream_features.py"]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      FEAST_S3_ENDPOINT_URL: http://minio:9000
      FEAST_REGISTRY: s3://${MINIO_BUCKET}/feature-store/registry.db
      FEAST_SKU_DAILY_PATH: s3://${MINIO_BUCKET}/feature-store/sku_daily
      FEAST_SKU_RETURN_24H_PATH: s3://${MINIO_BUCKET}/feature-store/sku_return_24h.parquet
      FEAST_REDIS: platform-control-plane:30379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure
    mem_limit: 768m

  # ML Platform: MLflow tracking + model registry. Sổ ghi ở DB `mlflow` của PostgreSQL có sẵn, artifact
  # ở MinIO; client (bước KFP trong kind) gửi artifact qua server nên không cần credential S3.
  registry:
    image: registry:2.8.3
    profiles: [ml]
    ports: ["127.0.0.1:5001:5000"]
    volumes: [registry-data:/var/lib/registry]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/v2/"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      kind:
        aliases: [registry]
    restart: unless-stopped
    mem_limit: 128m

  mlflow-db-init:
    image: postgres:15
    profiles: [ml]
    depends_on:
      postgres: {condition: service_healthy}
    env_file: .env
    entrypoint: >
      sh -c "export PGPASSWORD=$$POSTGRES_PASSWORD
      && psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc
      \"SELECT 1 FROM pg_database WHERE datname='mlflow'\" | grep -q 1
      || psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'CREATE DATABASE mlflow'"

  mlflow:
    build: {context: ., dockerfile: docker/Dockerfile.mlflow}
    image: platformflow:3.17.0
    profiles: [ml]
    depends_on:
      mlflow-db-init: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      # Tắt hàng đợi job GenAI (7 tiến trình huey, ~1 GB RAM); ở đây chỉ dùng tracking + registry.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
              "--backend-store-uri", "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow",
              "--artifacts-destination", "s3://${MINIO_BUCKET}/mlflow",
              "--allowed-hosts", "*", "--workers", "1"]
    ports: ["${MLFLOW_PORT:-5050}:5000"]
    restart: unless-stopped
    mem_limit: 512m

  # Quản lý secret tập trung. Chế độ server, lưu file trong volume; init/unseal và nạp
  # secret bằng scripts/setup/setup_vault.sh. UI: http://localhost:8200
  vault:
    image: hashicorp/vault:2.1.1
    profiles: [security]
    command: ["server"]
    environment:
      VAULT_LOCAL_CONFIG: >-
        {"storage": {"file": {"path": "/vault/file"}},
         "listener": [{"tcp": {"address": "0.0.0.0:8200", "tls_disable": true}}],
         "ui": true, "disable_mlock": true, "api_addr": "http://vault:8200"}
    ports: ["${VAULT_PORT:-8200}:8200"]
    volumes: [vault-data:/vault/file]
    mem_limit: 256m

  # Jenkins CI/CD. network_mode host: build gọi được Vault, Flink REST, API kind
  # như trên máy host. JENKINS_HOME mount CÙNG đường dẫn host để bind mount của `docker compose` trong
  # workspace trỏ đúng. Khởi động bằng scripts/setup/setup_jenkins.sh (lấy secret từ Vault). UI :8090
  jenkins:
    build: {context: ., dockerfile: docker/Dockerfile.jenkins}
    image: platform-jenkins:2.580.1
    profiles: [ci]
    network_mode: host
    group_add: ["${DOCKER_GID:-973}"]
    environment:
      JENKINS_HOME: ${PWD}/out/jenkins_home
      JENKINS_OPTS: --httpPort=8090
      CASC_JENKINS_CONFIG: /var/jenkins_casc/jenkins.yaml
      COMPOSE_PROJECT_NAME: platform
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-}
      VAULT_CI_TOKEN: ${VAULT_CI_TOKEN:-}
    volumes: ["/var/run/docker.sock:/var/run/docker.sock",
              "${PWD}:/repo:ro",
              "${PWD}/out/jenkins_home:${PWD}/out/jenkins_home",
              "./infra/jenkins/jenkins.yaml:/var/jenkins_casc/jenkins.yaml:ro",
              "./out/jenkins/kubeconfig:/run/secrets/kubeconfig:ro"]
    mem_limit: 1g

  # Trino federation: one SQL endpoint for Iceberg on MinIO and PostgreSQL.
  # Run in the separate `query` profile to limit RAM contention with Spark and Flink.
  trino:
    image: trinodb/trino:483
    profiles: [query]
    depends_on:
      lakekeeper: {condition: service_healthy}
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["${TRINO_PORT:-8083}:8080"]
    volumes: [./trino/catalog:/etc/trino/catalog:ro]
    mem_limit: 2g

  # CDC của bảng nguồn Walmart. Kafka Connect dùng các topic nội bộ riêng để giữ
  # cấu hình và offset khi container khởi động lại.
  debezium-connect:
    image: quay.io/debezium/connect:3.4
    profiles: [cdc]
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: platform-cdc-connect
      CONFIG_STORAGE_TOPIC: platform_cdc_connect_configs
      OFFSET_STORAGE_TOPIC: platform_cdc_connect_offsets
      STATUS_STORAGE_TOPIC: platform_cdc_connect_statuses
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    ports: ["${DEBEZIUM_PORT:-8084}:8083"]
    mem_limit: 1280m

  # Giao diện xem topic Kafka (bao gồm topic CDC do Debezium ghi) để chụp bằng chứng.
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: [cdc]
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_CLUSTERS_0_NAME: platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["${KAFKA_UI_PORT:-8085}:8080"]
    mem_limit: 640m

volumes:
  spark-local-1:
  spark-local-2:
  minio-data:
  postgres-data:
  kafka-data:
  airflow-data:
  vault-data:
  registry-data:

networks:
  kind:
    external: true
    name: kind
