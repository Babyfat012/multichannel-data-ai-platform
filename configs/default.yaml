# Cấu hình đầy đủ theo docs/generator-design.md, mục 10.
seed: 42
scale:
  n_skus: 2000
  start_date: 2026-01-01     # ngày mô phỏng 1
  days_history: 180          # từ ngày 1 tới cutoff
  days_stream: 30            # sau cutoff
  orders_per_day: 4000
  sku_zipf_exponent: 0.8     # SKU bán chạy nhất khoảng 5% Order Line (tính với 2.000 SKU)
storefront_weights:          # skew theo Storefront, phải cộng lại bằng 1
  amazon_us: 0.45
  tiktok_shop_us: 0.15
  amazon_uk: 0.12
  amazon_de: 0.10
  shopify: 0.08
  walmart_us: 0.07
  shopee_vn: 0.03
labels:
  window_days: 30
offline_problems:
  duplicate_rate: 0.02
  overlap_days: 3
  amazon_orders_api_switch_day: 100    # từ ngày này Amazon ghi theo Orders 2026-01-01
storage:
  output_root: ./out/default
streaming_problems:
  pacing:
    default_seconds_per_sim_day: 60
    segments:
      - {from_day: 195, to_day: 195, seconds_per_sim_day: 600}   # ngày livestream phát chậm để thấy burst
  duplicate_rate: {tiktok_shop_us: 0.015}
  amazon_late: {median_minutes: 5, share_over_1h: 0.05}
drift:
  tiktok_live: {day: 195, start_hour_utc: 12, duration_hours: 6, burst_multiplier: [5, 8]}
  prime_day:                 # Sale Event trên các Storefront Amazon (covariate drift)
    day: 120
    days: 2
    order_multiplier: 4      # số Order Amazon gấp 4 lần ngày thường
    discount_share: 0.7      # 70% Order Line Amazon được giảm giá
    deal_skus: 50            # số SKU được đẩy mạnh trong ngày sale
