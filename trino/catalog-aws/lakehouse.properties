# Iceberg REST catalog (Lakekeeper trên EC2) + S3 thật trên AWS; credential tạm từ IAM role của EC2
# (IMDSv2, hop limit 2), không access key, không endpoint riêng.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=${ENV:WAREHOUSE_NAME}

fs.s3.enabled=true
s3.region=${ENV:AWS_REGION}
