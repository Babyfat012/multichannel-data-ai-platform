# Configure the Iceberg REST catalog and MinIO warehouse shared with Spark.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=fsds

# Trino's native S3 client reads the same MinIO warehouse that Spark writes.
fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=local-01
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
