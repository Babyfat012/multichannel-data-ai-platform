# Cấu hình Feast. Biến môi trường do DAG/pod truyền vào, nên cùng file chạy được
# local (MinIO + Redis trong kind) và GCP (gs:// + Redis trên GKE).
project: platform
provider: local
registry: ${FEAST_REGISTRY}
offline_store:
  type: file
online_store:
  type: redis
  connection_string: ${FEAST_REDIS}
entity_key_serialization_version: 3
