[project]
name = "fsds-generator"
version = "0.1.0"
description = "Data generator giả lập dữ liệu bán hàng đa kênh của một Seller"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "fsspec>=2024.6",
    "pyarrow>=17.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator"]
