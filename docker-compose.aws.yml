# Overlay AWS (EC2 t3.xlarge 16 GiB): Compose >= 2.24.4 để thay hẳn port/volume bằng !override.
# Chỉ khởi động catalog, spark, airflow; không bật profile disabled-aws. Không có access key:
# Spark, Iceberg và Lakekeeper lấy credential tạm từ IAM role qua IMDSv2 (hop limit 2).
x-s3-env: &s3-env
  PLATFORM_STORAGE: s3
  AWS_REGION: ${AWS_REGION:?AWS_REGION_required}
  RAW_BUCKET: ${RAW_BUCKET:?RAW_BUCKET_required}
  LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:?LAKEHOUSE_BUCKET_required}
  PLATFORM_CONTRACTS_DIR: /opt/contracts
services:
  minio:
    profiles: !override [disabled-aws]
    scale: 0
    ports: !override
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
  minio-init:
    profiles: !override [disabled-aws]
    scale: 0
  postgres:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    cpus: "0.5"
    mem_limit: 2g
    volumes: !override
      - /mnt/platform-data/postgres:/var/lib/postgresql/data
  generator-batch:
    profiles: !override [disabled-aws]
    scale: 0
  generator-load:
    profiles: !override [disabled-aws]
    scale: 0
  kafka:
    profiles: !override [disabled-aws]
    scale: 0
    ports: !override
      - "127.0.0.1:${KAFKA_PORT:-9094}:9094"
  generator-stream:
    profiles: !override [disabled-aws]
    scale: 0
  lakekeeper-db-init:
    cpus: "0.1"
    mem_limit: 128m
  lakekeeper-migrate:
    cpus: "0.1"
    mem_limit: 256m
    environment:
      LAKEKEEPER__ENABLE_AWS_SYSTEM_CREDENTIALS: "true"
  lakekeeper:
    ports: !override
      - "127.0.0.1:${LAKEKEEPER_PORT:-8181}:8181"
    cpus: "0.25"
    mem_limit: 512m
    environment:
      LAKEKEEPER__ENABLE_AWS_SYSTEM_CREDENTIALS: "true"
  spark-master:
    ports: !override
      - "127.0.0.1:${SPARK_MASTER_PORT:-7077}:7077"
      - "127.0.0.1:${SPARK_UI_PORT:-8080}:8080"
    cpus: "0.25"
    mem_limit: 512m
    image: platform-airflow:2.10.5-spark3.5.3
    # Image Airflow có /entrypoint chuyển mọi lệnh lạ thành `airflow <lệnh>` => exit 2.
    # Giữ dumb-init (PID 1 chuyển tín hiệu dừng), bỏ /entrypoint để chạy thẳng spark-class.
    entrypoint: [/usr/bin/dumb-init, --]
    command: !override
      - /home/airflow/.local/lib/python3.10/site-packages/pyspark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
    environment: !override
      <<: *s3-env
      PYTHONPATH: /opt
      SPARK_HOME: /home/airflow/.local/lib/python3.10/site-packages/pyspark
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
    volumes: !override
      - ./spark_jobs:/opt/spark_jobs:ro
      - ./generator:/opt/generator:ro
      - ./contracts:/opt/contracts:ro
      - ./sql:/opt/sql:ro
      - /mnt/platform-data/spark-events:/spark-events
  spark-worker-1:
    cpus: "2"
    mem_limit: 3500m
    image: platform-airflow:2.10.5-spark3.5.3
    # Image Airflow có /entrypoint chuyển mọi lệnh lạ thành `airflow <lệnh>` => exit 2.
    # Giữ dumb-init (PID 1 chuyển tín hiệu dừng), bỏ /entrypoint để chạy thẳng spark-class.
    entrypoint: [/usr/bin/dumb-init, --]
    command: !override
      - /home/airflow/.local/lib/python3.10/site-packages/pyspark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      <<: *s3-env
      PYTHONPATH: /opt
      SPARK_HOME: /home/airflow/.local/lib/python3.10/site-packages/pyspark
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      # Phải chừa trong mem_limit 3500m: JVM worker (~0,5 GB) + overhead mỗi executor (≥384 MB).
      # 3g từng cho 2 executor 1536m/worker ⇒ Docker OOM-kill (exit 137, dp3_walmart_labels 2026-10-28).
      SPARK_WORKER_MEMORY: 2560m
      SPARK_WORKER_CORES: "2"
      # Mỗi app chép ~400 MB jar vào $SPARK_HOME/work trong container (ổ gốc 29 GB); 2026-10-27 đầy ổ sau ~19 app.
      SPARK_WORKER_OPTS: -Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.interval=600 -Dspark.worker.cleanup.appDataTtl=1800
    volumes: !override
      - ./spark_jobs:/opt/spark_jobs:ro
      - ./generator:/opt/generator:ro
      - ./contracts:/opt/contracts:ro
      - ./sql:/opt/sql:ro
      - /mnt/platform-data/spark-events:/spark-events
      - /mnt/platform-data/spark-worker-1:/spark-local
  spark-worker-2:
    cpus: "2"
    mem_limit: 3500m
    image: platform-airflow:2.10.5-spark3.5.3
    # Image Airflow có /entrypoint chuyển mọi lệnh lạ thành `airflow <lệnh>` => exit 2.
    # Giữ dumb-init (PID 1 chuyển tín hiệu dừng), bỏ /entrypoint để chạy thẳng spark-class.
    entrypoint: [/usr/bin/dumb-init, --]
    command: !override
      - /home/airflow/.local/lib/python3.10/site-packages/pyspark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      <<: *s3-env
      PYTHONPATH: /opt
      SPARK_HOME: /home/airflow/.local/lib/python3.10/site-packages/pyspark
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      # Phải chừa trong mem_limit 3500m: JVM worker (~0,5 GB) + overhead mỗi executor (≥384 MB).
      # 3g từng cho 2 executor 1536m/worker ⇒ Docker OOM-kill (exit 137, dp3_walmart_labels 2026-10-28).
      SPARK_WORKER_MEMORY: 2560m
      SPARK_WORKER_CORES: "2"
      # Mỗi app chép ~400 MB jar vào $SPARK_HOME/work trong container (ổ gốc 29 GB); 2026-10-27 đầy ổ sau ~19 app.
      SPARK_WORKER_OPTS: -Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.interval=600 -Dspark.worker.cleanup.appDataTtl=1800
    volumes: !override
      - ./spark_jobs:/opt/spark_jobs:ro
      - ./generator:/opt/generator:ro
      - ./contracts:/opt/contracts:ro
      - ./sql:/opt/sql:ro
      - /mnt/platform-data/spark-events:/spark-events
      - /mnt/platform-data/spark-worker-2:/spark-local
  airflow-db-init:
    cpus: "0.1"
    mem_limit: 128m
  airflow:
    ports: !override
      - "127.0.0.1:${AIRFLOW_WEB_PORT:-8081}:8080"
    cpus: "1"
    mem_limit: 4g
    environment:
      <<: *s3-env
      PYTHONPATH: /opt
      SPARK_HOME: /home/airflow/.local/lib/python3.10/site-packages/pyspark
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      AIRFLOW_VAR_PLATFORM_SPARK_PACKAGES: ${PLATFORM_SPARK_PACKAGES_AWS:?packages_required}
      AIRFLOW_VAR_PLATFORM_ORDER_LIFECYCLE_SOURCE_ROOT: s3a://${RAW_BUCKET}/order_lifecycle/${PLATFORM_DATASET_NAME:-fixture}
      AIRFLOW_VAR_PLATFORM_ORDER_LIFECYCLE_CUTOFF: ${PLATFORM_ORDER_LIFECYCLE_CUTOFF:-2026-06-01T00:00:00.000000Z}
      # DAG v1 (dp1 -> dp2 -> dp3) đọc bộ 100 GB trên S3, đủ 180 ngày (window 0 = nạp hết).
      AIRFLOW_VAR_PLATFORM_DP1_AMAZON_SOURCE: s3a://${RAW_BUCKET}/order_snapshots/source-exports/channel=amazon/dataset=orders
      AIRFLOW_VAR_PLATFORM_DP1_EXTRA_SOURCE_ROOT: s3a://${RAW_BUCKET}/order_snapshots/source-exports
      AIRFLOW_VAR_PLATFORM_DP1_AMAZON_WINDOW_DAYS: "0"
      # dp3_return_labels: đáp án nhãn, sổ khóa 4 kênh và khóa nối nằm trên S3 (executor không có /data local).
      AIRFLOW_VAR_PLATFORM_DP3_GROUND_TRUTH: s3a://${RAW_BUCKET}/order_snapshots/ground-truth
      AIRFLOW_VAR_PLATFORM_DP3_WALMART_KEYS: s3a://${RAW_BUCKET}/order_snapshots/ground-truth-bridge/walmart-keys.parquet
      # ML: Feast đọc/ghi S3 thật bằng IAM role; Redis online là NodePort trên EKS; cutoff của Gold A.
      AIRFLOW_VAR_PLATFORM_FEAST_ROOT: s3://${LAKEHOUSE_BUCKET}/feature-store
      AIRFLOW_VAR_PLATFORM_FEAST_REDIS: ${PLATFORM_FEAST_REDIS:-}
      # RAG (đợt 4): tài liệu + chunk trên S3 lakehouse; pgvector là NodePort trên node EKS (Ansible -e rag_pg).
      AIRFLOW_VAR_PLATFORM_RAG_ROOT: s3://${LAKEHOUSE_BUCKET}/rag
      AIRFLOW_CONN_PLATFORM_RAG_PG: ${PLATFORM_RAG_PG_CONN:?PLATFORM_RAG_PG_CONN_required}
      AIRFLOW_VAR_PLATFORM_ML_CUTOFF: "2026-06-30T00:00:00Z"
      # Task Walmart của DAG v1 đọc PostgreSQL qua JDBC ngay trong driver Airflow.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      # spark-submit đọc biến này khi DAG không đặt executor memory; mặc định 1g quá chật cho Silver 100 GB.
      SPARK_EXECUTOR_MEMORY: 2g
    volumes: !override
      - ./spark_jobs:/opt/spark_jobs:ro
      - ./generator:/opt/generator:ro
      - ./contracts:/opt/contracts:ro
      - ./sql:/opt/sql:ro
      # Định nghĩa Feast cho ml_feature_materialize (feast apply/materialize chạy trong container này).
      - ./feature_repo:/opt/feature_repo:ro
      - ./rag:/opt/rag/rag:ro
      - /mnt/platform-data/spark-events:/spark-events
      - /mnt/platform-data/airflow:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
      - ./scripts:/opt/platform/scripts:ro
      - ./infra/aws/ansible:/opt/aws-runtime:ro
  flink-jobmanager:
    profiles: !override [disabled-aws]
    scale: 0
    ports: !override
      - "127.0.0.1:${FLINK_UI_PORT:-8082}:8081"
  flink-taskmanager:
    profiles: !override [disabled-aws]
    scale: 0
  # Trino liên nguồn (Novel #1): Iceberg trên S3 qua IAM role + PostgreSQL EC2; chỉ bật khi đo
  # (--profile query), nghe loopback, xem UI qua tunnel 8083.
  trino:
    profiles: !override [query]
    cpus: "1"
    mem_limit: 3g
    depends_on: !override
      lakekeeper: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment: !override
      <<: *s3-env
      WAREHOUSE_NAME: ${WAREHOUSE_NAME:-}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: !override
      - ./trino/catalog-aws:/etc/trino/catalog:ro
    ports: !override
      - "127.0.0.1:${TRINO_PORT:-8083}:8080"
  debezium-connect:
    profiles: !override [disabled-aws]
    scale: 0
    ports: !override
      - "127.0.0.1:${DEBEZIUM_PORT:-8084}:8083"
  kafka-ui:
    profiles: !override [disabled-aws]
    scale: 0
    ports: !override
      - "127.0.0.1:${KAFKA_UI_PORT:-8085}:8080"
  # MLflow trên EC2: sổ ghi ở DB mlflow của Postgres EC2, artifact ở S3 lakehouse qua IAM role (server
  # proxy artifact nên pod KFP trên EKS không cần quyền S3). Nghe loopback (tunnel) + IP riêng VPC cho
  # EKS (SG chỉ mở 5050 từ SG cluster), không 0.0.0.0.
  mlflow:
    cpus: "0.25"
    mem_limit: 512m
    depends_on: !override
      mlflow-db-init: {condition: service_completed_successfully}
    environment: !override
      <<: *s3-env
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command: !override ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
              "--backend-store-uri", "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow",
              "--artifacts-destination", "s3://${LAKEHOUSE_BUCKET}/mlflow",
              "--allowed-hosts", "*", "--workers", "1"]
    ports: !override
      - "127.0.0.1:${MLFLOW_PORT:-5050}:5000"
      - "${PLATFORM_PRIVATE_IP:?PLATFORM_PRIVATE_IP_required}:${MLFLOW_PORT:-5050}:5000"
  # Vault trên EC2 (secret tập trung: mật khẩu UI, token…). Chỉ loopback, script ở laptop đi qua tunnel
  # 8200; dữ liệu trên EBS để stop/start EC2 không mất (cổng 8200 có sẵn trong data_service_ports).
  vault:
    cpus: "0.25"
    mem_limit: 256m
    ports: !override
      - "127.0.0.1:${VAULT_PORT:-8200}:8200"
    volumes: !override
      - /mnt/platform-data/vault:/vault/file
  # Exporter cho Prometheus trên EKS (pull): nghe IP riêng VPC, SG chỉ mở 9100/9187 từ SG cluster
  # (data_service_ports). Cảnh báo ổ đầy (#20) và WAL slot (#17) — luật ở prometheus-values-aws.yaml.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.1
    command: ["--path.rootfs=/host"]
    pid: host
    cpus: "0.1"
    mem_limit: 64m
    volumes:
      - /:/host:ro,rslave
    ports:
      - "${PLATFORM_PRIVATE_IP:?PLATFORM_PRIVATE_IP_required}:9100:9100"
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    cpus: "0.1"
    mem_limit: 64m
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    ports:
      - "${PLATFORM_PRIVATE_IP:?PLATFORM_PRIVATE_IP_required}:9187:9187"
  # Jenkins trên EC2 (đợt 5): build tại chỗ, deploy compose tại chỗ, push ECR + deploy EKS bằng IAM role EC2.
  # Chỉ nghe loopback (network host) ⇒ UI qua tunnel 8090. Job lấy code từ git bundle (rsync không mang .git).
  jenkins:
    environment:
      JENKINS_OPTS: --httpPort=8090 --httpListenAddress=127.0.0.1
      # Đường dẫn trơn, không `file://`: git chỉ nhận ra tệp bundle khi remote là path (file:// đòi thư mục repo).
      CI_GIT_REMOTE: /repo/out/platform.bundle
      AWS_REGION: ${AWS_REGION:?AWS_REGION_required}
    mem_limit: 1536m
