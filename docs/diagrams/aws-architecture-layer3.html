ator</text><text x="340" y="2144" class="mono" font-size="11" fill="#4f5d75" text-anchor="start">Prometheus pull metric, kể cả EC2 :9100/:9187; KEDA scale agent; Fluent Bit → Loki; OTLP → Jaeger.</text><circle cx="42" cy="2167" r="10" fill="white" stroke="#7b4fa0"/><text x="42" y="2170" class="mono" font-size="9" fill="#7b4fa0" text-anchor="middle">C</text><text x="65" y="2171" class="sans" font-size="12" fill="#7b4fa0" text-anchor="start">CI/CD · Developer</text><text x="340" y="2171" class="mono" font-size="11" fill="#4f5d75" text-anchor="start">Jenkins EC2 test → build → ECR → EKS qua access entry ci; helm --atomic / eval / prompt sync.</text></svg></main></html>
