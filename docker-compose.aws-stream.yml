# Bật Kafka + Flink (Stream) hoặc Kafka + Debezium (CDC dp1_cdc) trên EC2, time-share với Spark.
# Dùng thêm sau hai file chuẩn:
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml -f docker-compose.aws-stream.yml \
#     --profile stream --profile flink up -d kafka flink-jobmanager flink-taskmanager
#   CDC: ... --profile cdc up -d kafka debezium-connect
# Cổng chỉ mở loopback; xem UI qua SSM port forwarding. Đầu ra Flink nằm trên EBS dữ liệu, thư mục phải
# thuộc user flink của image: sudo install -d -o 9999 -g 9999 /mnt/platform-data/flink
services:
  kafka:
    profiles: !override [stream, cdc]
    scale: 1
    cpus: "1"
    mem_limit: 1536m
    environment:
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    ports: !override
      - "127.0.0.1:${KAFKA_PORT:-9094}:9094"
  flink-jobmanager:
    profiles: !override [flink]
    scale: 1
    cpus: "1"
    ports: !override
      - "127.0.0.1:${FLINK_UI_PORT:-8082}:8081"
    volumes: !override
      - ./flink_jobs:/opt/flink/jobs:ro
      - /mnt/platform-data/flink:/opt/flink/output
  flink-taskmanager:
    profiles: !override [flink]
    scale: 1
    cpus: "2"
    volumes: !override
      - ./flink_jobs:/opt/flink/jobs:ro
      - /mnt/platform-data/flink:/opt/flink/output
  # Debezium đọc WAL của Postgres EC2 (wal_level=logical từ file gốc) và ghi topic platform_cdc.walmart.orders.
  debezium-connect:
    profiles: !override [cdc]
    scale: 1
    cpus: "1"
    ports: !override
      - "127.0.0.1:${DEBEZIUM_PORT:-8084}:8083"
