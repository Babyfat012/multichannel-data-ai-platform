# Bật Kafka + Flink (Stream) hoặc Kafka + Debezium (CDC dp1_cdc) trên EC2, time-share với Spark.
# Dùng thêm sau hai file chuẩn:
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml -f docker-compose.aws-stream.yml \
#     --profile stream --profile flink up -d kafka flink-jobmanager flink-taskmanager
#   CDC: ... --profile cdc up -d kafka debezium-connect
# Cổng chỉ mở loopback; xem UI qua SSM port forwarding. Đầu ra Flink nằm trên EBS dữ liệu, thư mục phải
# thuộc user flink của image: sudo install -d -o 9999 -g 9999 /mnt/platform-data/flink
# Kafka (gap #5 #12) ghi topic trên EBS, thư mục thuộc appuser: sudo install -d -o 1000 -g 1000 /mnt/platform-data/kafka
# Stream feature A (đợt 4): ... --profile stream --profile flink --profile ml-stream up -d kafka flink-jobmanager \
#   flink-taskmanager feast-pusher (pusher: build trên EC2 trước, `... build feast-pusher`).
services:
  kafka:
    profiles: !override [stream, cdc]
    scale: 1
    cpus: "1"
    mem_limit: 1536m
    environment:
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    ports: !override
      - "127.0.0.1:${KAFKA_PORT:-9094}:9094"
    volumes: !override
      - /mnt/platform-data/kafka:/var/lib/kafka/data
  flink-jobmanager:
    profiles: !override [flink]
    scale: 1
    cpus: "1"
    ports: !override
      - "127.0.0.1:${FLINK_UI_PORT:-8082}:8081"
    volumes: !override
      - ./flink_jobs:/opt/flink/jobs:ro
      - /mnt/platform-data/flink:/opt/flink/output
  flink-taskmanager:
    profiles: !override [flink]
    scale: 1
    cpus: "2"
    # 1 GB của file gốc (cỡ laptop) hết heap khi checkpoint stream A: state bỏ trùng ~401k Return + cửa sổ HOP 24h.
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 4096m
        taskmanager.numberOfTaskSlots: 2
    mem_limit: 4608m
    volumes: !override
      - ./flink_jobs:/opt/flink/jobs:ro
      - /mnt/platform-data/flink:/opt/flink/output
  # Debezium đọc WAL của Postgres EC2 (wal_level=logical từ file gốc) và ghi topic platform_cdc.walmart.orders.
  debezium-connect:
    profiles: !override [cdc]
    scale: 1
    cpus: "1"
    ports: !override
      - "127.0.0.1:${DEBEZIUM_PORT:-8084}:8083"
  # Flink ghi ml.sku_return_24h → push Feast: Redis trên EKS (NodePort, IP node từ Ansible) + Parquet offline S3.
  # S3 qua IAM role EC2: không key, không endpoint MinIO.
  feast-pusher:
    cpus: "0.5"
    depends_on:
      kafka: {condition: service_healthy}
    environment: !override
      AWS_REGION: ${AWS_REGION:?AWS_REGION_required}
      FEAST_REGISTRY: s3://${LAKEHOUSE_BUCKET}/feature-store/registry.db
      FEAST_SKU_DAILY_PATH: s3://${LAKEHOUSE_BUCKET}/feature-store/sku_daily
      FEAST_SKU_RETURN_24H_PATH: s3://${LAKEHOUSE_BUCKET}/feature-store/sku_return_24h.parquet
      FEAST_REDIS: ${PLATFORM_FEAST_REDIS:?PLATFORM_FEAST_REDIS_required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
