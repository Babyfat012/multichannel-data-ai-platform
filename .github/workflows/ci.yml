# CI tối thiểu (ADR-0012): ruff, chặn thay đổi schema contract phá vỡ, chạy pytest.
# Không Docker/Spark/Cloud: test Spark chạy trong image riêng, ngoài CI này.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12.13" # khớp máy local: dataset_version băm theo bản Python
      - name: Cài thư viện theo uv.lock
        run: uv sync --frozen
      - name: Ruff (format + lint)
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Kiểm registry hợp đồng
        run: uv run python -m spark_jobs.lib.data_contracts check-registry --contracts-dir contracts
      - name: Pytest
        run: uv run pytest -q
